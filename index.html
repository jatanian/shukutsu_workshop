<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北運河・祝津 電動アシスト自転車ツアー まとめ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="page">
      <div class="eyebrow">Tarukuru Workshop — Kitaunga / Shukutsu Tour</div>
      <h1 class="title">北運河・祝津 電動アシスト自転車ツアー<br>スポットまとめ</h1>
      <p class="lede">シンポジウム・ワークショップ用の資料。北運河〜祝津エリアの候補スポットを、写真・動画・位置・Googleの口コミ・メモとともに一覧できるようにしている。</p>
    </header>

    <section class="map-section">
      <h2 class="section-title" style="font-size:20px;margin:0 0 12px;">エリアマップ</h2>
      <div class="map-frame">
        <iframe src="https://www.google.com/maps/d/embed?mid=1K6jB22s8jFDUO1Y_Ba3nVLz1d5WGyZY&ehbc=2E312F" width="100%" height="420" style="border:0;" loading="lazy"></iframe>
      </div>
    </section>

    <div class="controls">
      <div class="filter-chips" id="filter-chips"></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="スポット名・メモで検索">
      </div>
    </div>
    <div class="result-count" id="result-count"></div>

    <div class="spot-grid" id="spot-grid"></div>

    <footer class="page">
      <p>タルクル(小樽商科大学) — 北運河・祝津 電動アシスト自転車ツアー ワークショップ資料</p>
    </footer>
  </div>

  <script src="data/spots.js"></script>
  <script src="app.js"></script>
</body>
</html>
